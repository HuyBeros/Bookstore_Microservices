services:
  ai-vectors:
    image: pgvector/pgvector:pg17
    profiles: [ai-rag]
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookstore_vectors
      POSTGRES_USER: ${AI_VECTOR_DB_USER:-${DB_USERNAME:-postgres}}
      POSTGRES_PASSWORD: ${AI_VECTOR_DB_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD}}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ai-vector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:17
    container_name: bookstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      POSTGRES_DB: QLBookStore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bookstore-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bookstore.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD}}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: bookstore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  ai-vector-data:
  postgres-data:
  redis-data:
